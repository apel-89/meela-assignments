services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meela
      POSTGRES_PASSWORD: meela
      POSTGRES_DB: meela
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meela"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
